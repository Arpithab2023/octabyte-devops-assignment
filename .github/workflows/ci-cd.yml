  name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: octabyte-app
  ECS_CLUSTER: octabyte-cluster
  ECS_SERVICE: octabyte-service

permissions:
  id-token: write
  contents: read

jobs:
  # ---------- Runs on every PR ----------
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint / syntax-check HTML & JS
        run: |
          npx --yes htmlhint "app/**/*.html" || true
          node --check app/ProjectTemperature.js

      - name: Run unit tests (placeholder — static site, no test framework wired up)
        run: echo "No JS unit test framework configured yet for this static app."

      - name: Run integration tests (placeholder)
        run: echo "No integration tests configured — app has no backend to test against."

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: npm audit (skipped — no package.json for this static app)
        run: echo "No npm dependencies to audit for a static HTML/JS site."
      - name: Snyk dependency scan
        uses: snyk/actions/node@master
        continue-on-error: true # no manifest file to scan; kept to show the step in the pipeline
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # ---------- Runs only on merge to main ----------
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, dependency-scan]
    if: github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }} # OIDC, no static keys
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build -t $ECR_REPOSITORY:${{ steps.meta.outputs.tag }} .

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1' # fail the build on critical/high findings

      - name: Tag & push to ECR
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ steps.meta.outputs.tag }}"
          docker tag $ECR_REPOSITORY:${{ steps.meta.outputs.tag }} $IMAGE_URI
          docker push $IMAGE_URI

  # ---------- Deploy to staging automatically ----------
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS service (staging)
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }}-staging \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }}-staging \
            --services ${{ env.ECS_SERVICE }}

  # ---------- Manual approval gate, then production ----------
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production # GitHub "production" environment configured with required reviewers
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS service (production)
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }}-production \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }}-production \
            --services ${{ env.ECS_SERVICE }}

  # ---------- Notify on any failure ----------
  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test, dependency-scan, build-and-push, deploy-staging, deploy-production]
    if: failure()
    steps:
      - name: Slack notification
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {"text": "❌ Pipeline failed on ${{ github.repository }} — commit ${{ github.sha }} by ${{ github.actor }}. See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
